<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oginga Quote Calculator</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #0b1d13;
  color: white;
  padding: 15px;
  margin: 0;
}

h2 {
  text-align: center;
}

button {
  width: 100%;
  padding: 14px;
  margin: 6px 0;
  font-size: 16px;
  border: none;
  border-radius: 8px;
}

.service {
  background: #1f6f3d;
  color: white;
}

.size {
  background: #2e8b57;
  color: white;
}

.action {
  background: #f4c542;
  color: black;
}

.result {
  font-size: 20px;
  margin-top: 10px;
}

.line {
  margin: 5px 0;
  border-bottom: 1px solid #333;
  padding: 5px;
}
</style>
</head>

<body>

<h2>Oginga Yardscape Quote</h2>

<h3>1. Select Service</h3>
<div id="services"></div>

<h3>2. Select Size</h3>
<div id="sizes"></div>

<button class="action" onclick="addItem()">Add Service</button>

<h3>Quote</h3>
<div id="quote"></div>

<div class="result" id="subtotal"></div>
<div class="result" id="tax"></div>
<div class="result" id="total"></div>

<button class="action" onclick="resetQuote()">Reset Quote</button>

<script>
let selectedService = null;
let selectedSize = null;
let items = [];

const services = ["Aeration", "Dethatching", "Cleanup", "Fertilizer", "Mulching"];
const sizes = ["Small", "Medium", "Large", "Estate"];

const prices = {
  Aeration: { Small: 90, Medium: 120, Large: 150, Estate: 180 },
  Dethatching: { Small: 140, Medium: 180, Large: 220, Estate: 260 },
  Cleanup: { Small: 200, Medium: 350, Large: 550, Estate: 700 },
  Fertilizer: { Small: 350, Medium: 450, Large: 650, Estate: 750 },
  Mulching: { Small: 130, Medium: 150, Large: 180, Estate: 200 }
};

function renderButtons(list, id, type) {
  let container = document.getElementById(id);
  container.innerHTML = "";

  list.forEach((value) => {
    let btn = document.createElement("button");
    btn.innerText = value;
    btn.className = type;
    btn.onclick = () => {
      if (type === "service") selectedService = value;
      if (type === "size") selectedSize = value;
    };
    container.appendChild(btn);
  });
}

function addItem() {
  if (!selectedService || !selectedSize) {
    alert("Select service & size first");
    return;
  }

  let price = prices[selectedService][selectedSize];

  items.push({
    service: selectedService,
    size: selectedSize,
    price: price
  });

  renderQuote();
}

function renderQuote() {
  let q = document.getElementById("quote");
  q.innerHTML = "";

  let subtotal = 0;

  items.forEach((item, index) => {
    let div = document.createElement("div");
    div.className = "line";
    div.innerHTML = item.service + " (" + item.size + ") - $" + item.price +
      " <button onclick='removeItem(" + index + ")'>❌</button>";
    q.appendChild(div);

    subtotal += item.price;
  });

  let tax = subtotal * 0.13;
  let total = subtotal + tax;

  document.getElementById("subtotal").innerText = "Subtotal: $" + subtotal.toFixed(2);
  document.getElementById("tax").innerText = "HST: $" + tax.toFixed(2);
  document.getElementById("total").innerText = "Total: $" + total.toFixed(2);
}

function removeItem(index) {
  items.splice(index, 1);
  renderQuote();
}

function resetQuote() {
  items = [];
  renderQuote();
}

renderButtons(services, "services", "service");
renderButtons(sizes, "sizes", "size");
</script>

</body>
</html>
